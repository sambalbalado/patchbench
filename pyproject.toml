[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbench"
version = "0.1.0"
description = "A reproducible evaluation harness for AI code reviewers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
patchbench = "patchbench.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
