[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbench"
version = "0.1.0"
description = "A reproducible evaluation harness for AI code reviewers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1",
    "openai>=2,<3",
    "pydantic>=2.9,<3",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13,<3", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
patchbench = "patchbench.runner:main"
patchbench-api = "patchbench.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchbench = ["migrations/*.sql", "web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
